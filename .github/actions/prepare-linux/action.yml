name: "Prepare Linux Build"

description: "Frees up disk space and installs required packages for Linux builds."

inputs:
  platform-arch:
    description: "The target platform architecture."
    required: true

runs:
  using: "composite"
  steps:
    - name: Disk cleanup
      run: |
        set -x
        df -h
        #sudo du -h -d1 /usr/local
        #sudo du -h -d1 /usr/local/share
        #sudo du -h -d1 /usr/local/lib
        #sudo du -h -d1 /usr/share
        RMI=`docker images -q -a`
        if [ -n "$RMI" ]; then
          docker rmi $RMI
        fi
        # 4.6G
        sudo rm -rf /usr/local/.ghcup
        # 1.7G
        sudo rm -rf /usr/share/swift
        # 1.4G
        sudo rm -rf /usr/share/dotnet
        # 13G
        sudo rm -rf /usr/local/lib/android
        df -h
      shell: bash

    - name: Install required packages
      run: |
        sudo apt update
        sudo apt install -y binutils cmake git locales lsb-release ninja-build pkg-config python3 python3-setuptools rsync unzip wget xz-utils

        # Chromium Clang to be used with the clang toolchain file
        #curl -s https://raw.githubusercontent.com/chromium/chromium/main/tools/clang/scripts/update.py | python3 - --output-dir=/opt/clang
        # Use a more stable version of Clang
        sudo mkdir -p /opt/clang
        # Keep this at the CLANG_REVISION-CLANG_SUB_REVISION that the pinned
        # WebRTC's tools/clang/scripts/update.py names: the JNI compiles
        # against that checkout's bundled libc++ headers, which need a matching
        # clang (M158's no longer compile with the old 20-init pin).
        wget https://commondatastorage.googleapis.com/chromium-browser-clang/Linux_x64/clang-llvmorg-24-init-14453-ge063be79-1.tar.xz
        # Verify the toolchain before extracting — the tarball is fetched over
        # the network and feeds the compiler for a published native library
        # (audit 2026-07-03 M6). Checksum computed 2026-11-03 (the download
        # matched the bucket's published MD5).
        echo "0b76afc1a29b0583f7723e966b9b65a22b15d8fdcd38e7c567ae32343c68944d  clang-llvmorg-24-init-14453-ge063be79-1.tar.xz" | sha256sum -c -
        sudo tar -xf clang-llvmorg-24-init-14453-ge063be79-1.tar.xz -C /opt/clang
      shell: bash

    - name: Install required packages for linux-x86_64
      if: inputs.platform-arch == 'x86_64'
      run: |
        sudo mkdir /opt/sysroot
        python3 webrtc-jni/src/main/cpp/dependencies/webrtc/linux/sysroot/install-sysroot.py --arch=amd64
        sudo mv webrtc-jni/src/main/cpp/dependencies/webrtc/linux/debian* /opt/sysroot/
      shell: bash

    - name: Install required packages for linux-aarch32
      if: inputs.platform-arch == 'aarch32'
      run: |
        sudo apt install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

        sudo mkdir /opt/sysroot
        python3 webrtc-jni/src/main/cpp/dependencies/webrtc/linux/sysroot/install-sysroot.py --arch=armhf
        sudo mv webrtc-jni/src/main/cpp/dependencies/webrtc/linux/debian* /opt/sysroot/
      shell: bash

    - name: Install required packages for linux-aarch64
      if: inputs.platform-arch == 'aarch64'
      run: |
        sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

        sudo mkdir /opt/sysroot
        python3 webrtc-jni/src/main/cpp/dependencies/webrtc/linux/sysroot/install-sysroot.py --arch=arm64
        sudo mv webrtc-jni/src/main/cpp/dependencies/webrtc/linux/debian* /opt/sysroot/
      shell: bash
